<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Test & Execute</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- tiny custom tweaks -->
  <style>
    /* subtle transition for feedback */
    .feedback-transition {
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    /* make execute subs a bit more interactive */
    .execute-sub {
      transition: background 0.15s, border-color 0.15s;
    }
    .execute-sub:hover {
      background: #f0f6fe;
      border-color: #b8cee5;
    }
  </style>
</head>
<body class="bg-[#eef3f9] min-h-screen flex items-center justify-center p-4">

  <input type="file" id="fileInput" accept="image/*">
<img id="yourpicture" src="" alt="Preview">

<script>
const fileInput = document.getElementById('fileInput');
const img = document.getElementById('yourpicture');

fileInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  
  if (file) {
    // Preview the image
    const reader = new FileReader();
    reader.onload = function(e) {
      img.src = e.target.result; // This works! No fakepath
    };
    reader.readAsDataURL(file);
    
    // You can also show the filename without fakepath
    document.getElementById('fileName').textContent = file.name;
  }
});
</script>

</body>
</html>
